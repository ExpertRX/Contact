    display: block;
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    border-radius: 3.5cqw;
    text-decoration: none;

  .hit:focus-visible {
    outline: 3px solid #00b9d7;
    outline-offset: 2px;

  /* Transparent hit areas sit directly over the original artwork buttons. */

  .main-number { left: 22.7%; top: 69.4%; width: 56.6%; height: 6.0%; }
  .email { left: 22.7%; top: 76.2%; width: 56.6%; height: 6.0%; }
  .website { left: 22.7%; top: 82.9%; width: 56.6%; height: 6.0%; }

  .qr-wrap { position: absolute; left: 40.7%; top: 49.6%; width: 18.6%; height: 14.2%; display: block; }

  .dialog-backdrop {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(22, 8, 24, .48);
    z-index: 10;
  }
  .dialog-backdrop.open { display: flex; }
  .dialog {
    width: min(340px, 100%);
    padding: 22px;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    text-align: center;
  }
  .dialog h1 {
    margin: 0 0 7px;
    color: #701078;
    font-size: 21px;
  }
  .dialog p {
    margin: 0 0 18px;
    color: #444;
    font-size: 15px;
  }
  .choice {
    display: block;
    width: 100%;
    min-height: 48px;
    margin: 9px 0;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(180deg, #bd4bc4 0%, #790d88 55%, #5e0871 100%);
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  .choice.cancel {
    color: #65106d;
    background: #f1e8f2;
  }
  @media (prefers-reduced-motion: no-preference) {
    .choice { transition: filter .15s ease, transform .15s ease; }
    .choice:active { transform: translateY(1px); filter: brightness(.95); }
  }

<body>
<main class="flyer" aria-label="Expert Compounding Pharmacy contact flyer">
  <button class="hit tracy" type="button" aria-label="Call or text Tracy Shuttleworth at 818-383-5882" id="tracyButton"></button>
  <a class="hit main-number" href="tel:8189887979" aria-label="Call Expert Compounding Pharmacy at 818-988-7979"></a>
  <a class="hit email" href="mailto:info@ExpertPharmacy.org" aria-label="Email info@ExpertPharmacy.org"></a>
  <a class="hit website" href="https://www.ExpertPharmacy.org" target="_blank" rel="noopener noreferrer" aria-label="Open Expert Compounding Pharmacy website"></a>

  <a class="qr-wrap" href="https://expertrx.github.io/Contact/" target="_blank" rel="noopener noreferrer" aria-label="Open the Expert RX contact page from the QR code"></a>
</main>

<div class="dialog-backdrop" id="choiceDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog">
    <h1 id="dialogTitle">Contact Tracy</h1>
    <p>Would you like to call or send a text?</p>
    <button class="choice" type="button" id="callTracy">Call Tracy</button>
    <button class="choice" type="button" id="textTracy">Send Text</button>
    <button class="choice cancel" type="button" id="cancelDialog">Cancel</button>
  </div>
</div>

<script>
(() => {
  const dialog = document.getElementById('choiceDialog');
  const openButton = document.getElementById('tracyButton');
  const closeDialog = () => {
    dialog.classList.remove('open');
    openButton.focus();
  };
  openButton.addEventListener('click', () => {
    dialog.classList.add('open');
    document.getElementById('callTracy').focus();
  });
  document.getElementById('callTracy').addEventListener('click', () => {
    window.location.href = 'tel:8183835882';
    closeDialog();
  });
  document.getElementById('textTracy').addEventListener('click', () => {
    window.location.href = 'sms:8183835882';
    closeDialog();
  });
  document.getElementById('cancelDialog').addEventListener('click', closeDialog);
  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) closeDialog();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && dialog.classList.contains('open')) closeDialog();
  });
})();
</script>
</body>
